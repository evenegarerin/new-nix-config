onboarding = false
[keys]
# Leader
prefix = ["ctrl+space", "ctrl+b"]

# Tabs
new_tab      = "prefix+shift+n"
previous_tab = "prefix+shift+h"
next_tab     = "prefix+shift+l"
close_tab    = "prefix+shift+q"

# Panes
split_vertical   = "prefix+v"   # side by side
split_horizontal = "prefix+n"   # stacked
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
close_pane       = "prefix+q"

# Workspaces
new_workspace      = "prefix+shift+c"        # was prefix+shift+n
previous_workspace = "prefix+shift+k"   # up
next_workspace     = "prefix+shift+j"   # down

# herdr
detach = "prefix+shift+e"

# Defaults that collided with the keys above, moved elsewhere
swap_pane_left   = "prefix+alt+h"    # was prefix+shift+h
swap_pane_down   = "prefix+alt+j"    # was prefix+shift+j
swap_pane_up     = "prefix+alt+k"    # was prefix+shift+k
swap_pane_right  = "prefix+alt+l"    # was prefix+shift+l

[ui.sound]
enabled = false
