# pacman/dnf don't exist on NixOS; these providers only log errors on every start
# and archlinuxpkgs downloads a ~79 MB package index into ~/.local/share/elephant.
ignored_providers = ["archlinuxpkgs", "dnfpackages"]

# Decides per launcher keybind whether the app gets a workspace of its own, see
# hypr/launch-tagged. The prefix is pasted into `sh -c`, so $HOME is expanded by
# the shell -- elephant itself does no variable substitution here.
launch_prefix = "$HOME/.config/hypr/launch-tagged"
