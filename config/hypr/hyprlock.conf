# Hyprlock configuration

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 0
}

animations {
    enabled = false
}

background {
    monitor =
    path = $HOME/.config/wallpapers/foggy-forrest-darker.png
}

# time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 130
    font_family = Plus Jakarta Sans Bold
    position = 0, 240
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = Plus Jakarta Sans Bold
    position = 0, 105
    halign = center
    valign = center
}

# username
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 22
    font_family = Plus Jakarta Sans Bold
    position = 0, -250
    halign = center
    valign = center
}

# password input
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    check_text = authenticating ...
    fail_color = rgba(0, 0, 0, 0)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Plus Jakarta Sans
    placeholder_text = <i><span foreground="##ffffff99">Enter Password</span></i>
    hide_input = false
    position = 0, -290
    halign = center
    valign = center
}
