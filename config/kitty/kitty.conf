# Kitty config
enable_audio_bell no
shell zsh
shell_integration enabled

font_family JetBrainsMono Nerd Font
font_size 11

remember_window_size no
window_padding_width 15

background_opacity 0.8

scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

confirm_os_window_close 0

scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'let b:ansi_preview = 1' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

map ctrl+v show_scrollback
map ctrl+shift+h
