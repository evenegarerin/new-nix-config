# Disable default prefix
unbind C-b
 
# Add Ctrl+Space as Prefix
set -g prefix C-Space

# Enable 256 colors
set -g default-terminal "screen-256color"
 
# switching panes
bind j select-pane -L
bind k select-pane -R
 
# vertical split
bind Enter split-window -h -c "#{pane_current_path}"
unbind "%"
 
# arrow to switch windows
bind h previous-window
bind l next-window
 
# Refresh configuration file
bind r source-file ~/.tmux.conf \; display-message "Configuration reloaded."

# Set status bar color
set -g status-style fg=default,bg=default

# Two-line status bar: empty line on top, normal status below
set -gu status-format                                  # reset to defaults (keeps reloads working)
set -g status 2
set -Fg 'status-format[1]' '#{status-format[0]}'      # copy the default line to line 2
set -g 'status-format[0]' '' 